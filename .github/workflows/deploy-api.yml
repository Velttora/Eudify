name: Deploy API

# Deploys apps/api to Fly.io (app `trofo-school-api`) on every push to main that
# touches the API or anything it depends on. The web app is NOT handled here:
# Vercel deploys it through its own Git integration, configured in the dashboard.
#
# Requires FLY_API_TOKEN as a secret of the `Production` environment, which is
# why the deploy job declares that environment — an environment secret is not
# visible to a job that does not opt into it:
#   fly tokens create deploy -a trofo-school-api
#   gh secret set FLY_API_TOKEN -R Velttora/Eudify --env Production

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'fly.toml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

# Never run two deploys at once, and never cancel one mid-flight: a cancelled
# release command can leave a migration half applied.
concurrency:
  group: deploy-api
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Only needed so `prisma generate` (the postinstall of @repo/database) can
  # parse the datasource block. No database is reached during CI.
  DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci'

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `@trofo/api...` scopes every task to the API and its workspace
      # dependencies, so the web app never enters this pipeline.
      - name: Lint
        run: pnpm turbo run lint --filter=@trofo/api...

      - name: Typecheck
        run: pnpm turbo run typecheck --filter=@trofo/api...

      - name: Build
        run: pnpm turbo run build --filter=@trofo/api...

  deploy:
    name: Deploy to Fly.io
    needs: verify
    # The repository is public: keep forks from ever reaching this job.
    if: github.repository == 'Velttora/Eudify'
    # Scopes the job to the environment holding FLY_API_TOKEN. It carries no
    # protection rules today; adding required reviewers here would turn every
    # production deploy into an approval gate without touching this file.
    environment: Production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Builds the image on Fly's remote builder from apps/api/Dockerfile, then
      # runs the release command from fly.toml (`prisma migrate deploy`) before
      # switching traffic. A failing migration aborts the release and the
      # current version keeps serving.
      - name: Deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
